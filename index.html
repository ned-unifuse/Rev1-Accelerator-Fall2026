<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer to Capital — Fall 2026 Action Items</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --panel: #f9f9f8;
    --surface: #f4f4f2;
    --text: #16181a;
    --text-2: #3d4147;
    --text-3: #6b7178;
    --text-4: #9aa0a6;
    --accent: #00749d;         /* Rev1 light blue, darkened for AA on white */
    --accent-teal: #005672;    /* Rev1 teal */
    --accent-hover: #005a7e;
    --ok: #1f7e6d;            /* soft Rev1 green (was #4f8a1e) */
    --ok-bg: #f0f7e6;
    --alert: #b3402f;
    --warn: #8a6d2f;
    --border: #e4e4e0;
    --border-subtle: #eeeee9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-feature-settings: "cv01", "ss03";
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px; }

  /* Nav */
  nav {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,0.88); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-subtle);
  }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 52px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--text-2); }
  .brand .brand-logo { height: 26px; width: auto; display: block; }
  .brand .mark {
    width: 20px; height: 20px; border-radius: 5px;
    background: linear-gradient(135deg, var(--accent-teal), var(--accent));
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: #fff;
  }
  .nav-right { display: flex; align-items: center; gap: 16px; font-size: 13px; font-weight: 500; }
  .nav-right a.tab {
    color: var(--text-3); text-decoration: none; padding: 4px 8px; border-radius: 6px;
  }
  .nav-right a.tab:hover { color: var(--text); background: var(--surface); }
  .nav-right a.tab { white-space: nowrap; }
  .nav-right a.tab.active { color: var(--ok); background: #fff; font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--ok); border-radius: 6px; }
  .nav-right a.tab.cta {
    color: #fff; background: var(--accent); font-weight: 500;
    padding: 6px 12px; border-radius: 6px; border: none; white-space: nowrap;
  }
  .nav-right a.tab.cta:hover { background: var(--accent-hover); color: #fff; }
  .nav-right .user { color: var(--text-3); }
  .nav-right .user b { color: var(--text); font-weight: 600; }
  .nav-right button {
    background: none; border: none; color: var(--text-3);
    font: inherit; cursor: pointer; padding: 4px 8px; border-radius: 6px;
  }
  .nav-right button:hover { color: var(--text); background: var(--surface); }

  /* Hero */
  .hero { padding: 56px 0 32px; }
  .hero h1 {
    font-size: clamp(30px, 4.5vw, 42px);
    font-weight: 600; letter-spacing: -0.024em; line-height: 1.08; max-width: 18ch;
  }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { margin-top: 14px; font-size: 15px; color: var(--text-3); max-width: 52ch; letter-spacing: -0.011em; }

  /* Stat strip */
  .stats {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle);
    padding: 14px 0; margin-bottom: 28px;
  }
  .stats.plain { gap: 40px; }
  .stats.plain .stat { padding: 0; border: none; background: none; }
  .stat {
    display: flex; align-items: baseline; gap: 8px;
    padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel);
    transition: border-color .12s, background .12s, box-shadow .12s;
  }
  .stat.clickable { cursor: pointer; }
  .stat.clickable:hover { border-color: var(--ok); box-shadow: inset 0 0 0 1.5px var(--ok); background: #fff; }
  .stat.filtered { border-color: var(--ok); box-shadow: inset 0 0 0 1.5px var(--ok); background: #fff; }
  .stat.filtered .lbl { color: var(--ok); font-weight: 600; }
  .stat .num { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .stat .num.ok { color: var(--ok); }
  .stat .lbl { font-size: 13px; color: var(--text-4); }

  /* Week = proper table container */
  main { padding-bottom: 96px; }
  .week { margin-bottom: 36px; }
  .week-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; cursor: pointer; user-select: none; gap: 16px; flex-wrap: wrap;
    background: rgba(0, 86, 114, 0.5);   /* Rev1 teal @ 50% */
    border-radius: 10px 10px 0 0;
    margin-bottom: 0;
    transition: background .12s;
  }
  .week-head:hover { background: rgba(0, 86, 114, 0.62); }
  .week.collapsed .week-head { border-radius: 10px; margin-bottom: 0; }
  .week:not(.collapsed) .week-head { margin-bottom: 8px; }
  .week-head h2 {
    font-size: 16px; font-weight: 600; letter-spacing: -0.016em; color: #ffffff;
    display: flex; align-items: center; gap: 10px;
  }
  .week-head h2:hover { color: #e6f2f7; }
  .chev {
    width: 18px; height: 18px; border-radius: 4px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #ffffff; font-size: 10px; transition: transform .15s ease;
    border: 1px solid rgba(255,255,255,0.35);
  }
  .week.collapsed .chev { transform: rotate(-90deg); }
  .week.collapsed .tbl-wrap { display: none; }
  .week-head .meta { font-size: 13px; color: rgba(255,255,255,0.85); }
  .week-head .meta b { color: #ffffff; font-weight: 600; }

  /* The table */
  .tbl-wrap {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg);
  }
  table.items { width: 100%; border-collapse: collapse; }
  table.items th {
    text-align: left; font-size: 11.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-4); background: var(--panel);
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  table.items td {
    padding: 14px 16px; vertical-align: top;
    border-bottom: 1px solid var(--border-subtle);
    font-size: 14px;
  }
  table.items tr:last-child td { border-bottom: none; }
  table.items tr:hover td { background: #fbfbfa; }
  tr.mine-done td { background: var(--ok-bg); }
  tr.mine-done:hover td { background: #e8f2da; }
  td.c-check { width: 44px; }
  .check {
    width: 20px; height: 20px; margin-top: 1px;
    border: 1.5px solid #c9cdc9; border-radius: 6px;
    background: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .12s, background .12s;
  }
  .check:hover { border-color: var(--ok); }
  tr.mine-done .check { background: var(--ok); border-color: var(--ok); }
  tr.mine-done .check::after { content: "✓"; font-size: 12px; font-weight: 600; color: #fff; }
  td.c-item .title { font-weight: 500; letter-spacing: -0.009em; }
  tr.mine-done td.c-item .title { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-4); }
  td.c-item .detail { font-size: 13px; color: var(--text-3); margin-top: 2px; letter-spacing: -0.004em; }
  td.c-item .detail a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(0,116,157,0.25); word-break: break-word; }
  td.c-item .detail a:hover { color: var(--accent-hover); }
  td.c-item .quote { font-size: 12.5px; color: var(--text-4); margin-top: 6px; }
  td.c-item .src { font-size: 12px; color: var(--text-4); margin-top: 3px; font-style: italic; }
  td.c-item .src::before { content: "Source: "; font-style: italic; }
  td.c-due { width: 110px; }
  .due { font-size: 13px; font-weight: 500; color: var(--text-3); white-space: nowrap; }
  .due.soon { color: var(--warn); }
  .due.overdue { color: var(--alert); font-weight: 600; }

  .empty { padding: 72px 0; text-align: center; color: var(--text-4); font-size: 14px; }

  /* Dashboard */
  .dash-grid { display: grid; grid-template-columns: minmax(0,1.6fr) minmax(0,1fr); gap: 20px; align-items: start; }
  .dash-side { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .dash-card { border: 1px solid var(--border); border-radius: 10px; background: var(--bg); overflow: hidden; }
  .dash-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); background: var(--panel); }
  .dash-head h2 { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); }
  .dash-more { font-size: 12px; color: var(--accent); text-decoration: none; white-space: nowrap; }
  .dash-more:hover { color: var(--accent-hover); }
  .dash-progress { height: 6px; background: var(--surface); border-radius: 3px; margin: 14px 16px 4px; overflow: hidden; }
  .dash-progress-fill { height: 100%; background: var(--ok); border-radius: 3px; transition: width .25s ease; }
  .dash-progress-lbl { font-size: 12px; color: var(--text-4); margin: 0 16px 8px; }
  .dash-tbl td { padding: 10px 16px; }
  .dash-alldone { padding: 28px 16px; text-align: center; font-size: 14px; color: var(--ok); background: var(--ok-bg); }
  .dash-done-hdr { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-4); padding: 12px 16px 0; }
  .dash-nextmeta { font-size: 12.5px; color: var(--text-3); padding: 12px 16px 0; }
  .dash-moreitems { font-size: 12.5px; color: var(--text-3); padding: 10px 16px; border-top: 1px solid var(--border-subtle); }
  .dash-moreitems a { color: var(--accent); }
  .dash-card .res-item { border-radius: 0; border-left: none; border-right: none; border-top: none; }
  @media (max-width: 760px) { .dash-grid { grid-template-columns: 1fr; } }
  .dash-seg { display: inline-flex; gap: 2px; background: var(--surface); border-radius: 6px; padding: 2px; }
  .dash-seg button {
    border: none; background: none; font: inherit; font-size: 12px; font-weight: 500;
    color: var(--text-3); padding: 4px 10px; border-radius: 5px; cursor: pointer; white-space: nowrap;
  }
  .dash-seg button:hover { color: var(--text); }
  .dash-seg button.on { background: #fff; color: var(--ok); font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--ok); }
  .dash-wk { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-4); margin-bottom: 2px; }

  /* Resources page */
  .res-section { margin-bottom: 14px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .res-section h3 {
    font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text); background: #f1f7e6; margin: 0; padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none;
  }
  .res-section h3:hover { background: #e4efd6; }
  .res-section h3 .chev {
    width: 18px; height: 18px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-3); font-size: 10px; transition: transform .15s ease; border: 1px solid var(--border);
  }
  .res-section.collapsed .chev { transform: rotate(-90deg); }
  .res-section.collapsed .res-list { display: none; }
  .res-section .res-count { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--text-3); margin-left: 10px; }
  .res-list { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .res-item {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 13px 16px; border-bottom: 1px solid var(--border-subtle);
    text-decoration: none;
  }
  .res-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .res-body .r-src { font-size: 12px; color: var(--text-4); font-style: italic; }
  .res-body .r-src::before { content: "Source: "; }
  .res-body .r-url { font-size: 11.5px; color: var(--accent); word-break: break-all; opacity: .75; }
  .r-open { font-size: 12px; color: var(--text-4); white-space: nowrap; }
  .res-item:hover .r-open { color: var(--accent); }
  .res-item:last-child { border-bottom: none; }
  .res-item:hover { background: #fbfbfa; }
  .res-item .r-label { font-size: 14px; font-weight: 500; color: var(--accent); letter-spacing: -0.006em; }
  .res-item:hover .r-label { color: var(--accent-hover); }
  .res-item .r-note { font-size: 12.5px; color: var(--text-2); font-weight: 500; text-align: left; }

  /* Feedback form */
  .fb label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin: 18px 0 6px; }
  .fb input[type=text], .fb select, .fb textarea {
    width: 100%; padding: 9px 12px; background: #fff;
    border: 1px solid var(--border); border-radius: 6px;
    font: inherit; font-size: 14px; color: var(--text);
  }
  .fb textarea { min-height: 140px; resize: vertical; }
  .fb input:focus, .fb select:focus, .fb textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,116,157,0.12); }
  .fb input[type=file] { font-size: 13px; color: var(--text-3); }
  .fb .company-display {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border-subtle);
    border-radius: 6px; padding: 8px 12px; font-size: 14px; font-weight: 500; color: var(--text-2);
  }
  .fb button.submit {
    margin-top: 24px; background: var(--accent-teal); color: #fff; border: none; border-radius: 6px;
    padding: 10px 24px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .fb button.submit:hover { background: #00445a; }
  .fb button.submit:disabled { opacity: .5; cursor: default; }
  .fb-success {
    max-width: 460px; margin: 48px auto; text-align: center;
    border: 1px solid var(--border); border-radius: 12px; padding: 40px 32px;
    background: var(--ok-bg);
  }
  .fb-success .big { font-size: 40px; margin-bottom: 8px; }
  .fb-success h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.016em; margin-bottom: 6px; }
  .fb-success p { font-size: 14px; color: var(--text-3); margin-bottom: 24px; }
  .fb-success .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .fb-success button {
    font: inherit; font-size: 14px; font-weight: 500; border-radius: 6px; padding: 9px 18px; cursor: pointer;
  }
  .fb-success button.primary { background: var(--accent-teal); color: #fff; border: none; }
  .fb-success button.primary:hover { background: #00445a; }
  .fb-success button.ghost { background: #fff; color: var(--text-2); border: 1px solid var(--border); }
  .fb-success button.ghost:hover { background: var(--surface); }

  /* Login */
  .gate-wrap { min-height: calc(100vh - 52px); display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
  .gate {
    width: 100%; max-width: 380px;
    border: 1px solid var(--border); border-radius: 12px; padding: 32px;
    box-shadow: 0 1px 2px rgba(20,24,28,0.04), 0 8px 24px rgba(20,24,28,0.06);
  }
  .gate h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 4px; }
  .gate p.sub { font-size: 13px; color: var(--text-3); margin-bottom: 24px; }
  .gate label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin: 16px 0 6px; }
  .gate select, .gate input {
    width: 100%; padding: 9px 12px;
    background: #fff; border: 1px solid var(--border); border-radius: 6px;
    font: inherit; font-size: 14px; color: var(--text);
  }
  .gate select:focus, .gate input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,116,157,0.12); }
  .gate button {
    margin-top: 24px; width: 100%;
    background: var(--accent-teal); color: #fff; border: none; border-radius: 6px;
    padding: 10px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .gate button:hover { background: #00445a; }
  .gate .err { color: var(--alert); font-size: 13px; margin-top: 10px; }

  footer {
    border-top: 1px solid var(--border-subtle);
    padding: 24px 0 40px; font-size: 12.5px; color: var(--text-3);
  }
  footer .wrap > div { max-width: 100%; word-break: break-word; }
  @media (min-width: 521px) {
    footer .wrap { flex-direction: row !important; justify-content: space-between; text-align: left; }
  }
  footer a { color: var(--text-3); text-decoration: none; }
  footer a:hover { color: var(--accent); }
  @media (max-width: 640px) {
    td.c-due, th.h-due { display: none; }
    .due { display: block; margin-top: 6px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="brand"><a href="#" onclick="showView('dashboard');return false" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;cursor:pointer"><img class="brand-logo" src="rev1-logo.png" alt="Rev1 Ventures" onerror="this.style.display='none'"> Customer to Capital</a></div>
    <div class="nav-right" id="nav-user"></div>
  </div>
</nav>
<script>
function navTabs(active){
  return `<a class="tab ${active==='dashboard'?'active':''}" href="#" onclick="showView('dashboard');return false">Dashboard</a>` +
         `<a class="tab ${active==='actions'?'active':''}" href="#" onclick="showView('actions');return false">Action items</a>` +
         (me ? `<a class="tab ${active==='resources'?'active':''}" href="#" onclick="showView('resources');return false">Resources</a>` : ``) +
         (me ? `<a class="tab cta" href="#" onclick="showView('feedback');return false">Submit a bug or feature request</a>` : ``);
}
function showView(v, skipPush){
  if(!skipPush && location.hash !== "#"+v){
    location.hash = "#"+v;   // push history entry; hashchange handler re-renders
    return;
  }
  document.querySelectorAll(".dash-seg button").forEach(b=>b.classList.remove("on"));
  if(v==='resources') loadResources();
  else if(v==='feedback') loadFeedback();
  else if(v==='actions') load();
  else loadDashboard();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", ()=>{ const v=(location.hash||"#dashboard").slice(1); showView(v, true); });
</script>

<div id="app">
  <div class="gate-wrap">
    <div class="gate">
      <h1>Sign in</h1>
      <p class="sub">Cohort action items · Fall 2026</p>
      <label for="company">Company</label>
      <select id="company"></select>
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Provided by your program lead" autocomplete="off">
      <button onclick="doLogin()">View action items</button>
      <div class="err" id="login-err"></div>
    </div>
  </div>
</div>

<footer>
  <div class="wrap" style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;flex-wrap:wrap">
    <div>Rev1 Ventures · Customer to Capital Accelerator · Fall 2026</div>
    <div><a href="https://www.rev1ventures.com/customer-to-capital/" target="_blank" rel="noopener">About the program</a></div>
  </div>
</footer>

<script>
const API = "https://neds-mac-mini.tail5f6f57.ts.net/api";
let me = sessionStorage.getItem("rev1-company") || null;
let token = sessionStorage.getItem("rev1-token") || null;
const expanded = {};

function cleanSource(src){ return String(src??"").replace(/^Email:\s*"?(Fwd:\s*)?/i, 'Email: "').replace(/\s*"/g, m=>m); }
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(s){if(!s)return'';const m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/);return m?`${m[2]}/${m[3]}/${m[1]}`:String(s);}
function dueClass(d){if(!d)return'';const m=d.match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return'';const days=(new Date(+m[1],+m[2]-1,+m[3])-new Date())/864e5;return days<0?'overdue':days<3?'soon':'';}
function prettyUrl(u){
  try{ const h=new URL(u).hostname.replace(/^www\./,''); const seg=new URL(u).pathname.split('/').filter(Boolean); return seg.length? seg[seg.length-1].slice(0,42) : h; }catch(e){ return u; }
}
function linkify(s){
  const t = esc(s);
  const out = [];
  // tokenize: pull out markdown links first, then bare urls, emit text between
  const re = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|(https?:\/\/[^\s<]+)/g;
  let last = 0, m;
  while ((m = re.exec(t)) !== null) {
    out.push(t.slice(last, m.index));
    if (m[2]) out.push('<a href="'+m[2]+'" target="_blank" rel="noopener">'+m[1]+'</a>');
    else out.push('<a href="'+m[3]+'" target="_blank" rel="noopener">'+esc(prettyUrl(m[3]))+'</a>');
    last = re.lastIndex;
  }
  out.push(t.slice(last));
  return out.join('');
}

async function doLogin(){
  const company = document.getElementById("company").value;
  const password = document.getElementById("password").value;
  const r = await fetch(API+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({company,password})});
  const d = await r.json();
  if(!r.ok){ document.getElementById("login-err").textContent = d.error||"Login failed"; return; }
  me = d.company; token = d.token;
  sessionStorage.setItem("rev1-company",me); sessionStorage.setItem("rev1-token",token);
  loadDashboard();
}
function logout(){ sessionStorage.clear(); me=null; token=null; location.reload(); }
async function toggle(id){
  if(!token) return;
  const r = await fetch(API+"/toggle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,item_id:id})});
  if(r.status===401){ logout(); return; }
  const a = document.getElementById("app");
  if(a.dataset.view === 'dashboard'){ loadDashboard(); } else { load(); }
}

async function loadDashboard(){
  // Fetch data (signed-in personal state preferred)
  let data = null, R = null;
  if (token) {
    try {
      const r = await fetch(API+"/weeks-mine",{cache:"no-store",headers:{"Authorization":"Bearer "+token}});
      if(r.status===401){ logout(); return; }
      if(r.ok) data = await r.json();
      else data = await (await fetch(API+"/weeks",{cache:"no-store"})).json();
    } catch(e){
      try { data = await (await fetch(API+"/weeks",{cache:"no-store"})).json(); } catch(e2){}
    }
  }
  if(!data){
    try { data = await (await fetch(API+"/weeks",{cache:"no-store"})).json(); } catch(e){}
  }
  try { R = await (await fetch(API+"/resources",{cache:"no-store"})).json(); } catch(e){}
  const weeks = (data && data.weeks) || [];
  const app = document.getElementById("app");
  app.dataset.view = 'dashboard';
  document.getElementById("nav-user").innerHTML = navTabs('dashboard') + `<span class="user">Signed in as <b>${esc(me)}</b></span><button onclick="logout()">Sign out</button>`;
  if(!weeks.length){
    app.innerHTML = `<div class="wrap"><div class="empty">No digests processed yet.</div></div>`;
    return;
  }
  const latest = weeks[weeks.length-1];
  const prev = weeks.length>1 ? weeks[weeks.length-2] : null;

  // latest week: split open vs done
  const items = latest.items || [];
  const open = items.filter(it=>!(token ? !!it.done : false));
  const done = items.filter(it=>token ? !!it.done : false);
  const pct = items.length ? Math.round(done.length/items.length*100) : 0;

  // key resources: pick curated labels first, then fill from categories
  const curLabels = ["Program Box Folder (all participant files)","Nexudus","Milestone","Onboarding"];
  const pool = [];
  ["program_links","uploads","forms"].forEach(k=>{ if(R && R[k]) pool.push(...R[k].map((it,i)=>({...it,_cat:k}))); });
  const picked = [], seen = new Set();
  curLabels.forEach(cl=>{
    const hit = pool.find(it=>it.label && it.label.toLowerCase().includes(cl.toLowerCase()) && !seen.has(it.label));
    if(hit){ picked.push(hit); seen.add(hit.label); }
  });
  pool.forEach(it=>{ if(picked.length<4 && !seen.has(it.label)){ picked.push(it); seen.add(it.label); } });

  // upcoming: open items across all weeks with a future due date
  const today = new Date(); today.setHours(0,0,0,0);
  const allItems = weeks.flatMap(w=>(w.items||[]).map(it=>({...it, _wk: w.label||w.subject})));
  const upcoming = allItems.filter(it=>{
    if(token && it.done) return false;
    const m = String(it.due||'').match(/(\d{4})-(\d{2})-(\d{2})/); if(!m) return false;
    return new Date(+m[1],+m[2]-1,+m[3]) > today;
  }).sort((a,b)=>String(a.due).localeCompare(String(b.due)));

  window._dashScope = window._dashScope || "week"; // week | open | all
  const getScope = () => window._dashScope;
  const rowIt = (it, withWeek) => `<tr class="${token && it.done ? 'mine-done':''}" data-id="${esc(it.id)}">
      <td class="c-check"><div class="check" role="checkbox" aria-checked="${token && !!it.done}" tabindex="0"></div></td>
      <td class="c-item">
        ${withWeek && it._wk ? `<div class="dash-wk">${esc(it._wk)}</div>` : ''}
        <div class="title">${esc(it.title)}</div>
        ${it.due?`<span class="due ${dueClass(it.due)}" style="display:block;margin-top:4px">${esc(fmtDate(it.due))}</span>`:''}
      </td>
    </tr>`;

  function dashList(){
    if(getScope()==="week") return items.map(rowIt).join('');
    if(getScope()==="open") return allItems.filter(it=>!(token&&it.done)).map(it=>rowIt(it,true)).join('');
    return allItems.map(rowIt).join('');
  }
  function dashScopeStats(){
    let list = items, doneN = done.length;
    if(getScope()==="open"){ list = allItems.filter(it=>!(token&&it.done)); doneN = 0; }
    if(getScope()==="all"){ list = allItems; doneN = allItems.filter(it=>token&&it.done).length; }
    const openN = list.length - doneN;
    const pct = list.length ? Math.round(doneN/list.length*100) : 0;
    return {total:list.length, done:doneN, open:openN, pct};
  }
  function renderDashList(){
    const st = dashScopeStats();
    const tbl = document.getElementById("dash-list");
    if(tbl){
      const list = dashList();
      if(!list) tbl.innerHTML = `<tr><td class="c-item"><div class="dash-alldone">🎉 You're all caught up - nothing outstanding.</div></td></tr>`;
      else tbl.innerHTML = list;
    }
    const fill = document.querySelector(".dash-progress-fill"); if(fill) fill.style.width = st.pct+"%";
    const lbl = document.getElementById("dash-pct"); if(lbl) lbl.textContent = st.pct+"% complete";
    document.getElementById("s-done").textContent = st.done;
    document.getElementById("s-open").textContent = st.open;
    document.getElementById("s-total").textContent = st.total;
  }

  const segBtns = `<div class="dash-seg" role="tablist">
    ${[["week","This week"],["open","All open"],["all","All items →"]].map(([k,l])=>
      `<button role="tab" aria-selected="${getScope()===k}" class="${getScope()===k?'on':''}" onclick="setDashScope('${k}')">${l}</button>`).join('')}
  </div>`;
  window.setDashScope = k => {
    if(k==="all"){ showView('actions'); return; }
    window._dashScope = k;
    const labels = {week:"This week", open:"All open", all:"All items →"};
    document.querySelectorAll(".dash-seg button").forEach(b=>b.classList.toggle("on", b.textContent===labels[k]));
    document.querySelectorAll(".dash-seg button").forEach(b=>b.setAttribute("aria-selected", b.classList.contains("on")));
    renderDashList();
  };

  const st0 = dashScopeStats();
  app.innerHTML = `<div class="wrap">
    <section class="hero" style="padding-bottom:20px">
      <h1>Your week at a <em>glance.</em></h1>
      <p>${esc(latest.label || latest.subject || 'Latest digest')} · ${esc(fmtDate(latest.date))}</p>
    </section>
    <div class="stats plain">
      <div class="stat"><span class="num ok" id="s-done">${st0.done}</span><span class="lbl">done</span></div>
      <div class="stat"><span class="num" id="s-open">${st0.open}</span><span class="lbl">still open</span></div>
      <div class="stat"><span class="num" id="s-total">${st0.total}</span><span class="lbl">total</span></div>
    </div>
    <main>
      <div class="dash-grid">
        <section class="dash-card">
          <div class="dash-head"><h2>Action items</h2>${segBtns}</div>
          <div class="dash-progress"><div class="dash-progress-fill" style="width:${st0.pct}%"></div></div>
          <div class="dash-progress-lbl" id="dash-pct">${st0.pct}% complete</div>
          <table class="items dash-tbl"><tbody id="dash-list">${dashList() || `<tr><td class="c-item"><div class="empty" style="padding:24px 0">Nothing here - all clear.</div></td></tr>`}</tbody></table>
        </section>
        <div class="dash-side">
          <section class="dash-card">
            <div class="dash-head"><h2>Key resources</h2>
              <a href="#" onclick="showView('resources');return false" class="dash-more">All →</a></div>
            <div class="res-list" style="border:none;border-radius:0">
              ${picked.length ? picked.map(it=>`<a class="res-item" href="${esc(it.url)}" target="_blank" rel="noopener">
                <span class="res-body"><span class="r-label">${esc(it.label)}</span>
                ${it.note?`<span class="r-note">${esc(it.note)}</span>`:''}</span>
                <span class="r-open">Open →</span></a>`).join('') : '<div class="empty" style="padding:24px 0">No resources yet.</div>'}
            </div>
          </section>
          <section class="dash-card">
            <div class="dash-head"><h2>Coming up</h2></div>
            ${upcoming.length
              ? `<table class="items dash-tbl"><tbody>${upcoming.slice(0,5).map(rowIt).join('')}</tbody></table>
                 ${upcoming.length>5?`<div class="dash-moreitems">+ ${upcoming.length-5} more — <a href="#" onclick="showView('actions');return false">see all action items</a></div>`:''}`
              : `<div class="empty" style="padding:24px 0">Nothing on the horizon yet - next digest lands after the next session.</div>`}
          </section>
        </div>
      </div>
    </main>
  </div>`;
  // wire check toggles (dash rows -> full reload of view)
  app.querySelectorAll("tr[data-id] .check").forEach(chk=>{
    const go = e=>{ e.stopPropagation(); toggle(chk.closest("tr").dataset.id); };
    chk.addEventListener("click",go);
    chk.addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();go(e);} });
  });
}

async function load(){
  let r = null;
  if (token) {
    try { r = await fetch(API+"/weeks-mine",{cache:"no-store",headers:{"Authorization":"Bearer "+token}}); } catch(e){}
    if (!r || !r.ok) { logout(); return; }
  } else {
    r = await fetch(API+"/weeks",{cache:"no-store"});
  }
  const data = await r.json();
  const weeks = data.weeks||[];
  const app = document.getElementById("app");
  const nu = document.getElementById("nav-user");
  nu.innerHTML = navTabs('actions') + `<span class="user">Signed in as <b>${esc(me)}</b></span><button onclick="logout()">Sign out</button>`;
  let mineDone=0, total=0, mineOpen=0;
  const openFilter = { mode: "all" }; // all | open | done
  function applyRowFilter(){
    document.querySelectorAll(".week").forEach(div=>{
      div.querySelectorAll("tbody tr").forEach(tr=>{
        const isDone = tr.classList.contains("mine-done");
        const show = openFilter.mode==="all" || (openFilter.mode==="open" ? !isDone : isDone);
        tr.style.display = show ? "" : "none";
      });
    });
    const set = (id,on)=>{ const el=document.getElementById(id); if(el) el.classList.toggle("filtered", on); };
    set("stat-done", openFilter.mode==="done");
    set("stat-open", openFilter.mode==="open");
    const chip = document.getElementById("show-all-chip");
    if(chip) chip.style.display = openFilter.mode==="all" ? "none" : "inline-flex";
    const lbl = document.getElementById("s-openlbl");
    if(lbl) lbl.textContent = openFilter.mode==="open" ? "open items (filtered)" : "open items";
  }
  window.toggleOpenFilter = () => { openFilter.mode = openFilter.mode==="open" ? "all" : "open"; applyRowFilter(); };
  window.filterStat = m => { openFilter.mode = openFilter.mode===m ? "all" : m; applyRowFilter(); };
  app.innerHTML = `<div class="wrap">
    <section class="hero">
      <h1>Action items, <em>tracked together.</em></h1>
      <p>Every to-do from the program digests, tracked for your company.</p>
    </section>
    <div class="stats">
      <div class="stat clickable" id="stat-done" onclick="filterStat('done')"><span class="num ok" id="s-mine">0</span><span class="lbl">done by ${esc(me)}</span></div>
      <div class="stat clickable" id="stat-open" onclick="toggleOpenFilter()" title="Show only open items"><span class="num" id="s-open">0</span><span class="lbl" id="s-openlbl">open items</span></div>
      <div class="stat clickable" id="stat-total" onclick="filterStat('all')"><span class="num" id="s-total">0</span><span class="lbl">total items</span></div>
      <button id="show-all-chip" onclick="toggleOpenFilter()" style="display:none;margin-top:10px;align-self:center;font:inherit;font-size:12.5px;font-weight:500;color:var(--accent);background:#fff;border:1px solid var(--accent);border-radius:6px;padding:5px 12px;cursor:pointer">Show all</button>
    </div>
    <main id="board"></main>
  </div>`;
  const board = document.getElementById("board");
  if(!weeks.length){ board.innerHTML = `<div class="empty">No digests processed yet.</div>`; }
  weeks.forEach((w,wi)=>{
    const key = w.label || w.subject;
    if(!(key in expanded)) expanded[key] = (wi === weeks.length-1);
    const isOpen = expanded[key];
    const div = document.createElement("div"); div.className = "week" + (isOpen ? "" : " collapsed");
    let rows = (w.items||[]).map(it=>{
      total++;
      const mine = token ? !!it.done : false;
      if(mine) mineDone++; else if(token) mineOpen++;
      return `<tr class="${mine?'mine-done':''}" data-id="${esc(it.id)}">
        <td class="c-check"><div class="check" role="checkbox" aria-checked="${mine}" tabindex="0" title="${mine?'Mark not done':'Mark done for '+esc(me)}"></div></td>
        <td class="c-item">
          <div class="title">${esc(it.title)}</div>
          ${it.detail?`<div class="detail">${linkify(it.detail).replaceAll('\n','<br>')}</div>`:''}
          ${it.source_quote?`<div class="quote">"${esc(it.source_quote)}"</div>`:''}
          ${it.source?`<div class="src">${esc(it.source)}</div>`:''}
          <span class="due ${dueClass(it.due)}" style="display:none">${esc(fmtDate(it.due))}</span>
        </td>
        <td class="c-due">${it.due?`<span class="due ${dueClass(it.due)}">${esc(fmtDate(it.due))}</span>`:'—'}</td>
      </tr>`;
    }).join('');
    const openCount = (w.items||[]).filter(it=>!(token ? !!it.done : false)).length;
    div.innerHTML = `
      <div class="week-head"><h2><span class="chev">▼</span>${esc(key)}</h2><span class="meta">${esc(fmtDate(w.date))} · <b>${openCount}</b> open for you</span></div>
      <div class="tbl-wrap"><table class="items">
        <thead><tr><th class="c-check" style="width:44px"></th><th>Item</th><th class="h-due">Due</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
    board.appendChild(div);
    div.querySelector(".week-head").addEventListener("click",e=>{
      if(e.target.closest(".check")) return;
      expanded[key] = !expanded[key];
      div.classList.toggle("collapsed");
    });
    div.querySelectorAll("tr .check").forEach(chk=>{
      const go = (e)=>{ e.stopPropagation(); toggle(chk.closest("tr").dataset.id); };
      chk.addEventListener("click",go);
      chk.addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();go(e);} });
    });
  });
  document.getElementById("s-mine").textContent = mineDone;
  document.getElementById("s-open").textContent = token ? mineOpen : (total - mineDone);
  document.getElementById("s-total").textContent = total;
}

async function loadResources(){
  document.getElementById("nav-user").innerHTML = navTabs('resources') + `<span class="user">Signed in as <b>${esc(me)}</b></span><button onclick="logout()">Sign out</button>`;
  let R = {};
  try { R = await (await fetch(API+"/resources",{cache:"no-store"})).json(); } catch(e){}
  const sections = [
    ["program_links", "Program links"],
    ["uploads", "Templates & uploads"],
    ["forms", "Forms & sign-ups"],
    ["reading", "Reading list"],
    ["people", "People you've met"],
  ];
  const app = document.getElementById("app");
  app.innerHTML = `<div class="wrap">
    <section class="hero">
      <h1>Everything <em>in one place.</em></h1>
      <p>Box folders, templates, forms, reading, and contacts from the program digests.</p>
    </section>
    <main id="resboard" style="padding-top:24px"></main>
  </div>`;
  const board = document.getElementById("resboard");
  let any = false;
  sections.forEach(([key, title]) => {
    const items = R[key] || [];
    if(!items.length) return;
    any = true;
    const rows = items.map(it => `<a class="res-item" href="${esc(it.url)}" target="_blank" rel="noopener">
      <span class="res-body">
        <span class="r-label">${esc(it.label)}</span>
        ${it.note ? `<span class="r-note">${esc(it.note)}</span>` : ''}
        ${it.source ? `<span class="r-src">${esc(cleanSource(it.source))}</span>` : ''}
        <span class="r-url">${esc(it.url)}</span>
      </span>
      <span class="r-open">Open &rarr;</span>
    </a>`).join('');
    board.insertAdjacentHTML("beforeend", `<div class="res-section collapsed" data-rkey="${key}">
      <h3><span>${title}<span class="res-count">${items.length}</span></span><span class="chev">▼</span></h3>
      <div class="res-list">${rows}</div></div>`);
  });
  if(!any) board.innerHTML = `<div class="empty">No resources yet.</div>`;
  board.querySelectorAll(".res-section h3").forEach(h=>{
    h.addEventListener("click",()=>{ h.closest(".res-section").classList.toggle("collapsed"); });
  });
}

    <div class="fb" style="max-width:560px;padding-bottom:96px">

      <div class="company-display">🏢 ${esc(me)}</div>

async function submitFeedback(){
  const name = document.getElementById("fb-name").value.trim();
  const type = document.getElementById("fb-type").value;
  const text = document.getElementById("fb-text").value.trim();
  const errEl = document.getElementById("fb-err");
  errEl.textContent = "";
  if(!name){ errEl.textContent = "Please add your first name."; return; }
  if(!text){ errEl.textContent = "Please describe the issue."; return; }
  const btn = document.getElementById("fb-submit");
  btn.disabled = true; btn.textContent = "Submitting…";
  // screenshot -> data URL
  let screenshot = null;
  const f = document.getElementById("fb-file").files[0];
  if(f){
    screenshot = await new Promise(res => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => res(null);
      r.readAsDataURL(f);
    });
  }
  try {
    const r = await fetch(API+"/feedback",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({token, name, type, text, screenshot})
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || "failed");
  } catch(e){
    btn.disabled = false; btn.textContent = "Submit";
    errEl.textContent = "Submission failed - please try again.";
    return;
  }
  document.getElementById("app").innerHTML = `<div class="wrap"><div class="fb-success">
    <div class="big">✅</div>
    <h2>Request submitted</h2>
    <p>Thanks ${esc(name)} - your ${esc(type.toLowerCase())} has been logged and the team has been notified.</p>
    <div class="actions">
      <button class="primary" onclick="showView('feedback')">Submit another</button>
      <button class="ghost" onclick="showView('actions')">Back to action items</button>
    </div>
  </div></div>`;
  window.scrollTo(0,0);
}

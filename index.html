<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer to Capital — Fall 2026 Action Items</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,900&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #005672;        /* Rev1 primary */
    --green: #7bc144;       /* Rev1 accent */
    --dark: #32373c;        /* Rev1 ink */
    --gray: #525661;        /* Rev1 secondary text */
    --paper: #fafaf7;       /* warm off-white, YC-style */
    --line: #e3e2dc;
    --alert: #c0453a;       /* overdue */
    --warn: #9a7b2d;        /* due soon */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Nunito Sans", "Avenir Next", Avenir, sans-serif;
    background: var(--paper);
    color: var(--dark);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 24px; }

  /* Hero - YC-style: massive headline, left aligned, generous space */
  .hero { padding: 88px 0 64px; }
  .hero h1 {
    font-weight: 900;
    font-size: clamp(40px, 7vw, 68px);
    line-height: 1.02;
    letter-spacing: -0.03em;
    color: var(--teal);
    max-width: 16ch;
  }
  .hero h1 .accent { color: var(--green); }
  .hero p.lede {
    margin-top: 20px;
    font-size: 19px;
    color: var(--gray);
    max-width: 52ch;
    font-weight: 600;
  }
  .hero .program {
    margin-top: 10px;
    color: var(--gray);
    font-size: 15px;
  }

  /* Stat strip - thin rules, data not cards */
  .stats {
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 48px;
    padding: 20px 0;
    flex-wrap: wrap;
  }
  .stat { display: flex; align-items: baseline; gap: 10px; }
  .stat .num { font-weight: 900; font-size: 28px; letter-spacing: -0.02em; color: var(--teal); }
  .stat .lbl { font-size: 13px; color: var(--gray); }

  /* Week sections */
  main { padding: 8px 0 96px; }
  .week { border-top: 1px solid var(--line); }
  .week-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 26px 0 6px;
    cursor: pointer;
    user-select: none;
    gap: 16px;
    flex-wrap: wrap;
  }
  .week-head h2 {
    font-weight: 900;
    font-size: 24px;
    letter-spacing: -0.02em;
    color: var(--dark);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .week-head .chev { color: var(--green); font-weight: 700; font-size: 16px; transition: transform .15s; }
  .week.collapsed .chev { transform: rotate(-90deg); }
  .week.collapsed .week-items { display: none; }
  .week-head .meta { font-size: 14px; color: var(--gray); font-weight: 600; }
  .week-head .meta .open-n { color: var(--teal); }

  /* Items - editorial list rows, not cards */
  .item {
    display: flex;
    gap: 18px;
    padding: 20px 0;
    border-bottom: 1px solid var(--line);
    align-items: flex-start;
  }
  .item:last-child { border-bottom: none; }
  .check {
    width: 22px; height: 22px; min-width: 22px;
    border: 2px solid var(--dark);
    border-radius: 4px;
    cursor: pointer;
    background: var(--paper);
    margin-top: 3px;
    display: flex; align-items: center; justify-content: center;
  }
  .item.mine-done .check { background: var(--green); border-color: #5f9a2f; }
  .item.mine-done .check::after { content: "✓"; color: #fff; font-weight: 900; font-size: 14px; }
  .item.mine-done .title { text-decoration: line-through; color: var(--gray); }
  .item.locked .check { border-color: #b9b9b2; }
  .item-body { flex: 1; min-width: 0; }
  .title { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .detail { font-size: 15px; color: var(--gray); margin-top: 4px; }
  .detail a { color: var(--teal); text-decoration: underline; text-underline-offset: 2px; word-break: break-word; }
  .due { font-size: 13px; font-weight: 700; color: var(--green); margin-top: 6px; display: block; }
  .due.soon { color: var(--warn); }
  .due.overdue { color: var(--alert); }
  .quote {
    font-size: 13.5px; color: #8a8d94; margin-top: 8px;
    border-left: 2px solid var(--line); padding-left: 12px;
  }
  .doneby { margin-top: 8px; font-size: 13px; color: var(--gray); font-weight: 600; }
  .doneby .co { color: var(--teal); }
  .doneby .co.me { color: #5f9a2f; }
  .doneby .sep { color: var(--line); margin: 0 4px; }

  .empty { padding: 80px 0; text-align: center; color: var(--gray); font-size: 16px; }

  /* Login - minimal, centered, YC-apply style */
  .gate { max-width: 420px; margin: 0 auto; padding: 96px 24px 120px; }
  .gate h1 {
    font-weight: 900; font-size: 40px; letter-spacing: -0.03em;
    color: var(--teal); line-height: 1.05; margin-bottom: 8px;
  }
  .gate p.sub { color: var(--gray); font-weight: 600; margin-bottom: 28px; }
  .gate label { display: block; font-size: 14px; font-weight: 700; color: var(--dark); margin: 18px 0 6px; }
  .gate select, .gate input {
    width: 100%; padding: 12px 14px;
    border: 1px solid var(--dark); border-radius: 6px;
    font-family: inherit; font-size: 16px;
    background: #fff; color: var(--dark);
  }
  .gate select:focus, .gate input:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  .gate button {
    margin-top: 24px; width: 100%;
    background: var(--teal); color: #fff; border: none; border-radius: 6px;
    padding: 14px; font-family: inherit; font-size: 16px; font-weight: 700;
    cursor: pointer;
  }
  .gate button:hover { background: #00445a; }
  .gate .err { color: var(--alert); font-size: 14px; margin-top: 10px; font-weight: 600; }

  .who {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--line);
    font-size: 14px; color: var(--gray); font-weight: 600;
  }
  .who button {
    background: none; border: none; color: var(--teal);
    font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 28px 0 40px;
    font-size: 13.5px; color: var(--gray);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  footer a { color: var(--teal); text-decoration: none; font-weight: 700; }
  footer a:hover { text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div id="app">
  <div class="gate">
    <h1>Action Items</h1>
    <p class="sub">Customer to Capital · Fall 2026</p>
    <label for="company">Company</label>
    <select id="company"></select>
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Provided by your program lead" autocomplete="off">
    <button onclick="doLogin()">View action items</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<footer>
  <div>Customer to Capital Accelerator · Rev1 Ventures · Fall 2026</div>
  <div><a href="https://www.rev1ventures.com/customer-to-capital/" target="_blank" rel="noopener">About the program</a></div>
</footer>

<script>
const API = "https://neds-mac-mini.tail5f6f57.ts.net/api";
let me = sessionStorage.getItem("rev1-company") || null;
let token = sessionStorage.getItem("rev1-token") || null;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(s){if(!s)return'';const m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/);return m?`${m[2]}/${m[3]}/${m[1]}`:String(s);}
function dueClass(d){if(!d)return'';const m=d.match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return'';const days=(new Date(+m[1],+m[2]-1,+m[3])-new Date())/864e5;return days<0?'overdue':days<3?'soon':'';}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');}

async function doLogin(){
  const company = document.getElementById("company").value;
  const password = document.getElementById("password").value;
  const r = await fetch(API+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({company,password})});
  const d = await r.json();
  if(!r.ok){ document.getElementById("login-err").textContent = d.error||"Login failed"; return; }
  me = d.company; token = d.token;
  sessionStorage.setItem("rev1-company",me); sessionStorage.setItem("rev1-token",token);
  load();
}
function logout(){ sessionStorage.clear(); me=null; token=null; location.reload(); }
async function toggle(id){
  if(!token) return;
  const r = await fetch(API+"/toggle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,item_id:id})});
  if(r.status===401){ logout(); return; }
  load();
}

async function load(){
  const r = await fetch(API+"/weeks",{cache:"no-store"});
  const data = await r.json();
  const weeks = data.weeks||[];
  const app = document.getElementById("app");
  let mineDone=0, cohortDone=0, total=0;
  app.innerHTML = `
  <div class="wrap">
    <div class="who"><span>Signed in as <b>${esc(me)}</b></span><button onclick="logout()">Sign out</button></div>
    <section class="hero">
      <h1>What needs <span class="accent">done</span> this week.</h1>
      <p class="lede">Action items from the program digests, tracked across the cohort. Check things off as your company completes them.</p>
      <p class="program">Customer to Capital Accelerator · Fall 2026 · Rev1 Ventures</p>
    </section>
    <div class="stats">
      <div class="stat"><span class="num" id="s-mine">0</span><span class="lbl">done by ${esc(me)}</span></div>
      <div class="stat"><span class="num" id="s-cohort">0</span><span class="lbl">done across cohort (of <span id="s-total">0</span> items)</span></div>
    </div>
    <main id="board"></main>
  </div>`;
  const board = document.getElementById("board");
  if(!weeks.length){ board.innerHTML = `<div class="empty">No digests processed yet.</div>`; }
  weeks.forEach((w,wi)=>{
    const div = document.createElement("div"); div.className="week";
    let itemsHtml = (w.items||[]).map(it=>{
      total++;
      const doneBy = it.done_by||[];
      const mine = doneBy.includes(me);
      if(mine) mineDone++;
      if(doneBy.length) cohortDone++;
      const donebyHtml = doneBy.length
        ? `<div class="doneby">Done: ${doneBy.map(c=>`<span class="co ${c===me?'me':''}">${esc(c)}</span>`).join('<span class="sep">·</span>')}</div>` : '';
      return `<div class="item ${mine?'mine-done':'locked'}" data-id="${esc(it.id)}">
        <div class="check" role="checkbox" aria-checked="${mine}" tabindex="0" title="${mine?'Mark not done':'Mark done for '+esc(me)}"></div>
        <div class="item-body">
          <div class="title">${esc(it.title)}</div>
          ${it.detail?`<div class="detail">${linkify(it.detail)}</div>`:''}
          ${it.due?`<span class="due ${dueClass(it.due)}">Due ${esc(fmtDate(it.due))}</span>`:''}
          ${it.source_quote?`<div class="quote">"${esc(it.source_quote)}"</div>`:''}
          ${donebyHtml}
        </div></div>`;
    }).join('');
    const openCount = (w.items||[]).filter(it=>!(it.done_by||[]).includes(me)).length;
    div.innerHTML = `<div class="week-head"><h2><span class="chev">▼</span>${esc(w.label||w.subject)}</h2><span class="meta">${esc(fmtDate(w.date))} · <span class="open-n">${openCount}</span> open for you</span></div><div class="week-items">${itemsHtml}</div>`;
    board.appendChild(div);
    if(wi < weeks.length-1) div.classList.add("collapsed");
    div.querySelector(".week-head").addEventListener("click",e=>{if(!e.target.closest(".check"))div.classList.toggle("collapsed");});
    div.querySelectorAll(".item .check").forEach(chk=>{
      const go = ()=>toggle(chk.closest(".item").dataset.id);
      chk.addEventListener("click",e=>{e.stopPropagation();go();});
      chk.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();e.stopPropagation();go();}});
    });
  });
  document.getElementById("s-mine").textContent = mineDone;
  document.getElementById("s-cohort").textContent = cohortDone;
  document.getElementById("s-total").textContent = total;
}

(async()=>{
  const sel = document.getElementById("company");
  try {
    const r = await fetch(API+"/weeks"); const d = await r.json();
    const names = new Set();
    (d.weeks||[]).forEach(w=>(w.items||[]).forEach(it=>(it.done_by||[]).forEach(c=>names.add(c))));
    ["Unifuse AI", ...names].forEach(n=>{ const o=document.createElement("option"); o.textContent=n; sel.appendChild(o); });
  } catch(e){ const o=document.createElement("option"); o.textContent="Unifuse AI"; sel.appendChild(o); }
  sel.insertAdjacentHTML("beforeend","<option>Other…</option>");
  sel.addEventListener("change",()=>{ if(sel.value==="Other…"){ const v=prompt("Company name:"); if(v){ const o=document.createElement("option"); o.textContent=v; sel.appendChild(o); o.selected=true; } } });
  if(me && token) load();
})();
</script>
</body>
</html>

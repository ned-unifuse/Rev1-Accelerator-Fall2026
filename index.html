<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer to Capital — Fall 2026 Action Items</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090a;
    --panel: #0f1011;
    --surface: #191a1b;
    --hover: #28282c;
    --text: #f7f8f8;
    --text-2: #d0d6e0;
    --text-3: #8a8f98;
    --text-4: #62666d;
    --accent: #179bc8;        /* Rev1 light blue */
    --accent-teal: #005672;   /* Rev1 teal */
    --accent-hover: #4db8dd;
    --ok: #7bc144;            /* Rev1 green */
    --ok-dim: #5f9a2f;
    --alert: #e0655a;
    --warn: #d9b45c;
    --border: rgba(255,255,255,0.08);
    --border-subtle: rgba(255,255,255,0.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-feature-settings: "cv01", "ss03";
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 24px; }

  /* Nav */
  nav {
    position: sticky; top: 0; z-index: 10;
    background: rgba(8,9,10,0.85); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-subtle);
  }
  nav .wrap {
    display: flex; align-items: center; justify-content: space-between;
    height: 52px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--text-2); }
  .brand .mark {
    width: 20px; height: 20px; border-radius: 5px;
    background: linear-gradient(135deg, var(--accent-teal), var(--accent));
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: #fff;
  }
  .nav-right { display: flex; align-items: center; gap: 16px; font-size: 13px; font-weight: 500; }
  .nav-right .user { color: var(--text-3); }
  .nav-right .user b { color: var(--text); font-weight: 600; }
  .nav-right button {
    background: none; border: none; color: var(--text-3);
    font: inherit; cursor: pointer; padding: 4px 8px; border-radius: 6px;
  }
  .nav-right button:hover { color: var(--text); background: rgba(255,255,255,0.04); }

  /* Hero */
  .hero { padding: 72px 0 40px; }
  .hero h1 {
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 500;
    letter-spacing: -0.022em;
    line-height: 1.05;
    max-width: 18ch;
  }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p {
    margin-top: 16px; font-size: 15px; color: var(--text-3);
    max-width: 52ch; letter-spacing: -0.011em;
  }

  /* Stat strip */
  .stats {
    display: flex; gap: 40px; flex-wrap: wrap;
    border-top: 1px solid var(--border-subtle);
    border-bottom: 1px solid var(--border-subtle);
    padding: 18px 0; margin-bottom: 8px;
  }
  .stat { display: flex; align-items: baseline; gap: 8px; }
  .stat .num { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; color: var(--text); }
  .stat .num.ok { color: var(--ok); }
  .stat .lbl { font-size: 13px; color: var(--text-4); }

  /* Weeks */
  main { padding-bottom: 96px; }
  .week { border-top: 1px solid var(--border-subtle); }
  .week-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 0; cursor: pointer; user-select: none; gap: 16px; flex-wrap: wrap;
  }
  .week-head:hover h2 { color: var(--text); }
  .week-head h2 {
    font-size: 17px; font-weight: 600; letter-spacing: -0.016em;
    color: var(--text-2); display: flex; align-items: center; gap: 10px;
  }
  .chev {
    width: 18px; height: 18px; border-radius: 4px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-4); font-size: 10px; transition: transform .15s ease;
    border: 1px solid var(--border-subtle);
  }
  .week.collapsed .chev { transform: rotate(-90deg); }
  .week.collapsed .week-items { display: none; }
  .week-head .meta { font-size: 13px; color: var(--text-4); letter-spacing: -0.006em; }
  .week-head .meta b { color: var(--accent); font-weight: 600; }

  /* Items */
  .item {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 16px 0; border-top: 1px solid rgba(255,255,255,0.03);
  }
  .check {
    width: 20px; height: 20px; min-width: 20px; margin-top: 2px;
    border: 1px solid var(--border); border-radius: 6px;
    background: rgba(255,255,255,0.02);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .12s, border-color .12s;
  }
  .check:hover { border-color: var(--ok-dim); }
  .item.mine-done .check { background: var(--ok); border-color: var(--ok-dim); }
  .item.mine-done .check::after { content: "✓"; font-size: 12px; font-weight: 600; color: #0a0f08; }
  .item.locked .check { opacity: .5; }
  .item-body { flex: 1; min-width: 0; }
  .title { font-size: 15px; font-weight: 500; color: var(--text); letter-spacing: -0.009em; }
  .item.mine-done .title { color: var(--text-4); text-decoration: line-through; text-decoration-color: var(--text-4); }
  .detail { font-size: 14px; color: var(--text-3); margin-top: 3px; letter-spacing: -0.006em; }
  .detail a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(23,155,200,0.3); word-break: break-word; }
  .detail a:hover { color: var(--accent-hover); }
  .due { display: block; font-size: 12px; font-weight: 500; color: var(--text-4); margin-top: 6px; }
  .due.soon { color: var(--warn); }
  .due.overdue { color: var(--alert); }
  .quote { font-size: 13px; color: var(--text-4); margin-top: 8px; padding-left: 12px; border-left: 1px solid var(--border-subtle); letter-spacing: -0.003em; }
  .doneby { margin-top: 8px; font-size: 12px; color: var(--text-4); font-weight: 500; }
  .doneby .co { color: var(--text-3); }
  .doneby .co.me { color: var(--ok); }
  .doneby .sep { margin: 0 5px; opacity: .4; }

  .empty { padding: 72px 0; text-align: center; color: var(--text-4); font-size: 14px; }

  /* Login */
  .gate-wrap { min-height: calc(100vh - 52px); display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
  .gate {
    width: 100%; max-width: 380px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 32px;
  }
  .gate h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 4px; }
  .gate p.sub { font-size: 13px; color: var(--text-3); margin-bottom: 24px; letter-spacing: -0.004em; }
  .gate label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin: 16px 0 6px; }
  .gate select, .gate input {
    width: 100%; padding: 9px 12px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border); border-radius: 6px;
    font: inherit; font-size: 14px; color: var(--text);
  }
  .gate select option { background: var(--panel); color: var(--text); }
  .gate select:focus, .gate input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(23,155,200,0.15); }
  .gate button {
    margin-top: 24px; width: 100%;
    background: var(--accent-teal); color: #fff; border: none; border-radius: 6px;
    padding: 10px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .gate button:hover { background: #0a6d8e; }
  .gate .err { color: var(--alert); font-size: 13px; margin-top: 10px; }

  footer {
    border-top: 1px solid var(--border-subtle);
    padding: 24px 0 40px; font-size: 12.5px; color: var(--text-4);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  footer a { color: var(--text-3); text-decoration: none; }
  footer a:hover { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="brand"><span class="mark">R1</span> Customer to Capital</div>
    <div class="nav-right" id="nav-user"></div>
  </div>
</nav>

<div id="app">
  <div class="gate-wrap">
    <div class="gate">
      <h1>Sign in</h1>
      <p class="sub">Cohort action items · Fall 2026</p>
      <label for="company">Company</label>
      <select id="company"></select>
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Provided by your program lead" autocomplete="off">
      <button onclick="doLogin()">View action items</button>
      <div class="err" id="login-err"></div>
    </div>
  </div>
</div>

<footer>
  <div>Rev1 Ventures · Customer to Capital Accelerator · Fall 2026</div>
  <div><a href="https://www.rev1ventures.com/customer-to-capital/" target="_blank" rel="noopener">About the program</a></div>
</footer>

<script>
const API = "https://neds-mac-mini.tail5f6f57.ts.net/api";
let me = sessionStorage.getItem("rev1-company") || null;
let token = sessionStorage.getItem("rev1-token") || null;
const expanded = {}; // week label -> bool; survives re-render after toggles

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(s){if(!s)return'';const m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/);return m?`${m[2]}/${m[3]}/${m[1]}`:String(s);}
function dueClass(d){if(!d)return'';const m=d.match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return'';const days=(new Date(+m[1],+m[2]-1,+m[3])-new Date())/864e5;return days<0?'overdue':days<3?'soon':'';}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');}

async function doLogin(){
  const company = document.getElementById("company").value;
  const password = document.getElementById("password").value;
  const r = await fetch(API+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({company,password})});
  const d = await r.json();
  if(!r.ok){ document.getElementById("login-err").textContent = d.error||"Login failed"; return; }
  me = d.company; token = d.token;
  sessionStorage.setItem("rev1-company",me); sessionStorage.setItem("rev1-token",token);
  load();
}
function logout(){ sessionStorage.clear(); me=null; token=null; location.reload(); }
async function toggle(id){
  if(!token) return;
  const r = await fetch(API+"/toggle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,item_id:id})});
  if(r.status===401){ logout(); return; }
  load();
}

async function load(){
  const r = await fetch(API+"/weeks",{cache:"no-store"});
  const data = await r.json();
  const weeks = data.weeks||[];
  const app = document.getElementById("app");
  const nu = document.getElementById("nav-user");
  nu.innerHTML = `<span class="user">Signed in as <b>${esc(me)}</b></span><button onclick="logout()">Sign out</button>`;
  let mineDone=0, cohortDone=0, total=0;
  app.innerHTML = `<div class="wrap">
    <section class="hero">
      <h1>Action items, <em>tracked together.</em></h1>
      <p>Every to-do from the program digests, checked off company by company across the Fall 2026 cohort.</p>
    </section>
    <div class="stats">
      <div class="stat"><span class="num ok" id="s-mine">0</span><span class="lbl">done by ${esc(me)}</span></div>
      <div class="stat"><span class="num" id="s-cohort">0</span><span class="lbl">done across cohort</span></div>
      <div class="stat"><span class="num" id="s-total">0</span><span class="lbl">total items</span></div>
    </div>
    <main id="board"></main>
  </div>`;
  const board = document.getElementById("board");
  if(!weeks.length){ board.innerHTML = `<div class="empty">No digests processed yet.</div>`; }
  weeks.forEach((w,wi)=>{
    const key = w.label || w.subject;
    if(!(key in expanded)) expanded[key] = (wi === weeks.length-1); // newest open by default, preserved after
    const isOpen = expanded[key];
    const div = document.createElement("div"); div.className = "week" + (isOpen ? "" : " collapsed");
    let itemsHtml = (w.items||[]).map(it=>{
      total++;
      const doneBy = it.done_by||[];
      const mine = doneBy.includes(me);
      if(mine) mineDone++;
      if(doneBy.length) cohortDone++;
      const donebyHtml = doneBy.length
        ? `<div class="doneby">Done ${doneBy.map(c=>`<span class="co ${c===me?'me':''}">${esc(c)}</span>`).join('<span class="sep">·</span>')}</div>` : '';
      return `<div class="item ${mine?'mine-done':'locked'}" data-id="${esc(it.id)}">
        <div class="check" role="checkbox" aria-checked="${mine}" tabindex="0" title="${mine?'Mark not done':'Mark done for '+esc(me)}"></div>
        <div class="item-body">
          <div class="title">${esc(it.title)}</div>
          ${it.detail?`<div class="detail">${linkify(it.detail)}</div>`:''}
          ${it.due?`<span class="due ${dueClass(it.due)}">Due ${esc(fmtDate(it.due))}</span>`:''}
          ${it.source_quote?`<div class="quote">"${esc(it.source_quote)}"</div>`:''}
          ${donebyHtml}
        </div></div>`;
    }).join('');
    const openCount = (w.items||[]).filter(it=>!(it.done_by||[]).includes(me)).length;
    div.innerHTML = `<div class="week-head"><h2><span class="chev">▼</span>${esc(key)}</h2><span class="meta">${esc(fmtDate(w.date))} · <b>${openCount}</b> open for you</span></div><div class="week-items">${itemsHtml}</div>`;
    board.appendChild(div);
    // toggle on the chevron/title only - never interferes with item clicks
    div.querySelector(".week-head h2").addEventListener("click",()=>{
      expanded[key] = !expanded[key];
      div.classList.toggle("collapsed");
    });
    div.querySelectorAll(".item .check").forEach(chk=>{
      const go = (e)=>{ e.stopPropagation(); toggle(chk.closest(".item").dataset.id); };
      chk.addEventListener("click",go);
      chk.addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();go(e);} });
    });
  });
  document.getElementById("s-mine").textContent = mineDone;
  document.getElementById("s-cohort").textContent = cohortDone;
  document.getElementById("s-total").textContent = total;
}

(async()=>{
  const sel = document.getElementById("company");
  let names = [];
  try {
    const r = await fetch(API+"/companies");
    if (r.ok) { const d = await r.json(); names = d.companies || []; }
  } catch(e){}
  if (!names.length) {
    try {
      const r = await fetch(API+"/weeks"); const d = await r.json();
      const s = new Set(["Unifuse AI"]);
      (d.weeks||[]).forEach(w=>(w.items||[]).forEach(it=>(it.done_by||[]).forEach(c=>s.add(c))));
      names = [...s];
    } catch(e){ names = ["Unifuse AI"]; }
  }
  names.sort((a,b)=>a.localeCompare(b));
  names.forEach(n=>{ const o=document.createElement("option"); o.textContent=n; sel.appendChild(o); });
  sel.insertAdjacentHTML("beforeend","<option>Other…</option>");
  sel.addEventListener("change",()=>{ if(sel.value==="Other…"){ const v=prompt("Company name:"); if(v){ const o=document.createElement("option"); o.textContent=v; sel.appendChild(o); o.selected=true; } } });
  sel.value = me || sel.value;
  if(me && token) load();
})();
</script>
</body>
</html>
